name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'publish a release (tag = short sha)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build msimg32.dll
        shell: cmd
        working-directory: ncm-inject
        run: build-ci.bat

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          } else {
            $tag = $env:GITHUB_SHA.Substring(0,7)
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "version tag: $tag"

      - name: Assemble one-click package
        id: pkg
        shell: pwsh
        run: |
          $tag  = "${{ steps.ver.outputs.tag }}"
          $name = "ncm-plugin-framework-$tag"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage, "$stage/ncm-inject/build", "$stage/ncm-inject/payload", "$stage/config" | Out-Null

          # 1) 一键脚本
          Copy-Item package/install.cmd, package/install.ps1, package/uninstall.cmd, package/uninstall.ps1, package/start-devtools.cmd, package/QUICKSTART.txt $stage -Force
          Copy-Item tools/fetch-pet-assets.ps1 $stage -Force

          # 2) 注入器 DLL + 页面载荷
          Copy-Item ncm-inject/build/msimg32.dll "$stage/ncm-inject/build/msimg32.dll" -Force
          Copy-Item ncm-inject/payload/ncm-page.js "$stage/ncm-inject/payload/ncm-page.js" -Force

          # 3) 示例插件 + 配置样例
          Copy-Item plugins "$stage/plugins" -Recurse -Force
          Copy-Item config/broadcast.example.json "$stage/config/broadcast.example.json" -Force

          # 4) 校验和
          $dll  = "$stage/ncm-inject/build/msimg32.dll"
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash
          $size = (Get-Item $dll).Length
          @(
            "NCM Plugin Framework $tag",
            "built from: $env:GITHUB_SHA",
            "msimg32.dll size: $size bytes",
            "msimg32.dll sha256: $hash"
          ) | Set-Content "$stage/SHA256.txt" -Encoding utf8

          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "size=$size"   >> $env:GITHUB_OUTPUT
          "name=$name"   >> $env:GITHUB_OUTPUT

          # 5) 打包（zip 内保留顶层目录）
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          $zipKb = [math]::Round((Get-Item $zip).Length / 1KB, 1)
          Write-Host "package: $zip ($zipKb KB)"
          Write-Host "dll sha256: $hash"
          Get-ChildItem -Recurse $stage | Select-Object -First 40 FullName | Format-Table -HideTableHeaders

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ncm-plugin-framework ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            **一键包**：下载 zip → 解压 → 双击 `install.cmd`（UAC 选「是」）→ 完成。

            包内含：
            - `msimg32.dll` 注入器（已编译）
            - 页面载荷 `ncm-page.js`
            - 示例插件：Custom CSS / LAN Broadcast / Probe
            - `install.cmd` / `uninstall.cmd` / `start-devtools.cmd`
            - `QUICKSTART.txt`（中文使用说明）、`SHA256.txt`
            - `fetch-pet-assets.ps1`（可选：拉取 dsh-pet 桌宠素材，约 52 MB）

            构建信息：
            - `msimg32.dll` sha256：`${{ steps.pkg.outputs.sha256 }}`
            - 大小：`${{ steps.pkg.outputs.size }}` 字节
            - 提交：`${{ github.sha }}`

            安装会**自动备份**原始 `msimg32.dll` 到 `%LOCALAPPDATA%\NCMPlugin\backup\`，
            卸载时由 `uninstall.cmd` 恢复。
          files: dist/*.zip
          draft: false
          prerelease: false
