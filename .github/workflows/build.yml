name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'build a release (uses commit short sha as tag)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build msimg32.dll
        shell: cmd
        working-directory: ncm-inject
        run: build-ci.bat

      - name: Collect artifact info
        id: info
        shell: pwsh
        run: |
          $dll = "ncm-inject/build/msimg32.dll"
          if (-not (Test-Path $dll)) { throw "build output missing: $dll" }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash
          $size = (Get-Item $dll).Length
          "sha256=$hash"   >> $env:GITHUB_OUTPUT
          "size=$size"     >> $env:GITHUB_OUTPUT
          "size_kb=$([math]::Round($size/1KB,1))" >> $env:GITHUB_OUTPUT
          Write-Host "msimg32.dll: $size bytes, sha256=$hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: msimg32-${{ github.sha }}
          path: ncm-inject/build/msimg32.dll
          if-no-files-found: error

      - name: Rename for release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/','' } else { $env:GITHUB_SHA.Substring(0,7) }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item ncm-inject/build/msimg32.dll "dist/msimg32-$tag.dll"
          "tag=$tag" >> $env:GITHUB_OUTPUT
        id: rename

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rename.outputs.tag }}
          name: ncm-plugin-framework ${{ steps.rename.outputs.tag }}
          generate_release_notes: true
          body: |
            Automated build of `msimg32.dll` (the injector / plugin host loader).

            - file: `msimg32-${{ steps.rename.outputs.tag }}.dll` (rename to `msimg32.dll` when deploying)
            - sha256: `${{ steps.info.outputs.sha256 }}`
            - size: `${{ steps.info.outputs.size_kb }}` KB
            - built from: `${{ github.sha }}`

            Deploy: place it next to `cloudmusic.exe` (back up the original `msimg32.dll` first),
            then start NetEase Cloud Music.
          files: dist/msimg32-${{ steps.rename.outputs.tag }}.dll
          draft: false
          prerelease: false
